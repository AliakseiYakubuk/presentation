name: deploy:bucket 

on:
  workflow_call:
    inputs:
      domain:
        required: true
        type: string
      title:
        required: true
        type: string
      description:
        required: true
        type: string
      position:
        required: true
        type: string
      email:
        required: true
        type: string
      profileLinks:
        required: true
        type: string
      skills:
        required: true
        type: string
    secrets:
      awsAccessKeyId:
        required: true
      awsSecretAccessKey:
        required: true
      awsRegion:
        required: true
      gaTag:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v3

    - name: node-setup
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: install
      run: yarn

    - name: qa
      run: yarn lint

    - name: build
      run: yarn build
      env:
        VITE_DOMAIN: ${{ inputs.domain }}
        VITE_TITLE: ${{ inputs.title }}
        VITE_NAME: ${{ inputs.name }}
        VITE_POSITION: ${{ inputs.position }}
        VITE_DESCRIPTION: ${{ inputs.description }}
        VITE_EMAIL: ${{ inputs.email }}
        VITE_PROFILE_LINKS: ${{ inputs.profileLinks }}
        VITE_SKILLS: ${{ inputs.skills }}
        VITE_GA_TAG: ${{ secrets.gaTag }}

    - name: aws-cli-setup
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.awsAccessKeyId }}
        aws-secret-access-key: ${{ secrets.awsSecretAccessKey }}
        aws-region: ${{ secrets.awsRegion }}

    - name: cleanup
      run: aws s3 rm s3://${{ inputs.domain }}/ --recursive

    - name: sync
      run: aws s3 sync ./build/  s3://${{ inputs.domain }}/


