name: deploy:prod
on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: 'Version'
        required: true
        default: minor
        options:
        - patch
        - minor
        - major

jobs:

  yakubuk:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy.yaml
    with:
      domain: dev.${{ vars.DOMAIN }}
      title: ${{ vars.TITLE }}
      name: ${{ vars.NAME }}
      position: ${{ vars.POSITION }}
      description: ${{ vars.DESCRIPTION }}
      email: ${{ vars.EMAIL }}
      profileLinks: ${{ vars.PROFILE_LINKS }}
      skills: ${{ vars.SKILLS }}
    secrets:
      awsAccessKeyId: ${{ secrets.AWS_CV_ACCESS_KEY }}
      awsSecretAccessKey: ${{ secrets.AWS_CV_SECRET_KEY }}
      awsRegion: ${{ secrets.AWS_CV_REGION }}
      gaTag: ${{ secrets.GA_TAG }}

  release:
    needs: yakubuk
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v3

    - name: release
      run: |
        git config user.name ${{ github.actor }}
        git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        yarn version --new-version ${{ inputs.version }}
        git push https://${{ github.actor }}:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/${{ github.repository }}.git ${{ github.ref }} --follow-tags

  invalidation:
    needs: release
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v3

    - name: aws-cli-setup
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_CV_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_CV_SECRET_KEY }}
        aws-region: ${{ secrets.AWS_CV_REGION }}

    - name: invalidation
      run: yarn invalidate
